name: Build Android app

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Test game logic
        working-directory: web
        run: npm test

      - name: Build web game
        working-directory: web
        run: npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"
            echo "Release builds will be signed with your upload key."
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret: release AAB/APK will be unsigned. See docs/PLAY_STORE.md."
          fi

      - name: Build APK + AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Minutes since 2025-01-01: always increases, as Google Play requires.
          export VERSION_CODE=$(( ($(date +%s) - 1735689600) / 60 ))
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease assembleRelease

      - name: Check the game is packaged in the app
        run: |
          for apk in android/app/build/outputs/apk/*/*.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            unzip -l "$apk" | grep -E "assets/www/" | head -20
            unzip -l "$apk" | grep -q "assets/www/index.html" || { echo "::error::assets/www/index.html missing from $apk"; exit 1; }
          done
          ls -la android/app/build/outputs/bundle/release/

      - name: Upload debug APK (install on your phone to test)
        uses: actions/upload-artifact@v6
        with:
          name: bubble-shooter-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release AAB (for Google Play)
        uses: actions/upload-artifact@v6
        with:
          name: bubble-shooter-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: bubble-shooter-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Verify the release AAB is signed
        if: env.ANDROID_KEYSTORE_FILE != ''
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | grep "jar verified"
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA256:"

      # Without your secrets, prove the signing setup works using a throwaway key.
      # These test-signed files are deleted, never uploaded.
      - name: Check release signing works (throwaway key)
        if: env.ANDROID_KEYSTORE_FILE == ''
        working-directory: android
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-test.jks" -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 \
            -validity 30 -dname "CN=CI signing test" -storepass ci-test-pass -keypass ci-test-pass -noprompt
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/ci-test.jks" ANDROID_KEYSTORE_PASSWORD=ci-test-pass \
            ANDROID_KEY_ALIAS=upload ANDROID_KEY_PASSWORD=ci-test-pass \
            ./gradlew --no-daemon bundleRelease assembleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep "jar verified"
          test -f app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/bundle/release/app-release.aab | grep -q "base/assets/www/index.html"
          echo "Signing setup OK. Add your ANDROID_* secrets to get Play-ready builds."
          rm -rf app/build/outputs "$RUNNER_TEMP/ci-test.jks"
